<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр продаж «Тёплый пол»</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#171a2b;
    --panel2:#1e2237;
    --accent:#ff7a45;
    --accent2:#4dd4ac;
    --text:#e8eaf2;
    --muted:#8b90a8;
    --good:#4dd4ac;
    --mid:#f4c150;
    --bad:#ff5c6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 20% 0%,#1c2140,#0f1220 60%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px;
  }
  .app{width:100%;max-width:820px;display:flex;flex-direction:column;gap:16px}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);border-radius:16px;padding:14px 18px;
    border:1px solid #262b45;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .score{
    display:flex;align-items:center;gap:8px;font-weight:700;
    background:var(--panel2);padding:8px 14px;border-radius:10px;font-size:14px;
  }
  .score span{color:var(--accent2)}

  /* ---------- Menu ---------- */
  .menu{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{
    background:var(--panel);border:1px solid #262b45;border-radius:18px;
    padding:22px;cursor:pointer;transition:.2s;text-align:left;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px -12px rgba(255,122,69,.5)}
  .card .ico{font-size:34px;margin-bottom:10px}
  .card h3{font-size:17px;margin-bottom:6px}
  .card p{font-size:13px;color:var(--muted);line-height:1.5}
  .card .tag{
    display:inline-block;margin-top:12px;font-size:11px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--accent2);border:1px solid #2f5c4e;
    padding:3px 9px;border-radius:20px;
  }

  /* ---------- Chat ---------- */
  .game{display:flex;flex-direction:column;gap:14px}
  .hidden{display:none !important}

  .chat{
    background:var(--panel);border:1px solid #262b45;border-radius:18px;
    padding:18px;height:52vh;min-height:340px;overflow-y:auto;
    display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{width:6px}
  .chat::-webkit-scrollbar-thumb{background:#2e3455;border-radius:3px}

  .bubble{
    max-width:82%;padding:12px 16px;border-radius:16px;
    font-size:14.5px;line-height:1.55;animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bubble.client{
    align-self:flex-start;background:var(--panel2);
    border-bottom-left-radius:4px;
  }
  .bubble.me{
    align-self:flex-end;background:linear-gradient(135deg,#ff7a45,#ff9a5c);
    color:#1a0f08;font-weight:500;border-bottom-right-radius:4px;
  }
  .bubble.typing{display:flex;gap:5px;padding:14px 18px}
  .bubble.typing span{
    width:7px;height:7px;border-radius:50%;background:var(--muted);
    animation:blink 1.2s infinite;
  }
  .bubble.typing span:nth-child(2){animation-delay:.2s}
  .bubble.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .feedback{
    align-self:center;max-width:92%;font-size:13px;line-height:1.5;
    padding:11px 15px;border-radius:12px;border-left:3px solid;
    background:rgba(255,255,255,.03);animation:pop .25s ease;
  }
  .feedback.good{border-color:var(--good);color:#bff3e4}
  .feedback.mid{border-color:var(--mid);color:#f6e0a8}
  .feedback.bad{border-color:var(--bad);color:#ffc3ca}

  /* ---------- Options ---------- */
  .options{display:flex;flex-direction:column;gap:9px}
  .option{
    display:flex;gap:12px;align-items:flex-start;text-align:left;
    background:var(--panel);border:1px solid #2a3050;color:var(--text);
    padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.5;
    cursor:pointer;transition:.15s;font-family:inherit;
  }
  .option:hover{border-color:var(--accent);background:#1d2138;transform:translateX(4px)}
  .option .num{
    flex:0 0 24px;height:24px;border-radius:8px;background:#2a3050;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--accent);
  }
  .option:hover .num{background:var(--accent);color:#1a0f08}

  /* ---------- Result overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,10,20,.82);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
    animation:pop .3s ease;
  }
  .result{
    background:var(--panel);border:1px solid #2a3050;border-radius:22px;
    padding:34px 30px;max-width:440px;width:100%;text-align:center;
  }
  .result .emoji{font-size:56px;margin-bottom:10px}
  .result h2{font-size:22px;margin-bottom:8px}
  .result .pts{font-size:38px;font-weight:800;color:var(--accent);margin:14px 0 4px}
  .result .pts small{font-size:16px;color:var(--muted);font-weight:500}
  .result p{font-size:14px;color:var(--muted);line-height:1.6;margin-top:14px}
  .bar{height:8px;background:#232842;border-radius:4px;margin-top:18px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;transition:width .8s ease}
  .btn{
    margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  }
  .btn button{
    font-family:inherit;font-size:14px;font-weight:600;padding:12px 22px;
    border-radius:12px;border:1px solid #2a3050;background:var(--panel2);
    color:var(--text);cursor:pointer;transition:.15s;
  }
  .btn button:hover{border-color:var(--accent)}
  .btn button.primary{background:linear-gradient(135deg,#ff7a45,#ff9a5c);color:#1a0f08;border:none}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo"><span class="dot"></span> Тренажёр продаж · Тёплый пол</div>
    <div class="score" id="scoreBox">Баллы: <span id="score">0</span></div>
  </header>

  <!-- Меню выбора сценария -->
  <div class="menu" id="menu"></div>

  <!-- Игровой экран -->
  <div class="game hidden" id="game">
    <div class="chat" id="chat"></div>
    <div class="options" id="options"></div>
  </div>

</div>

<!-- Оверлей результата -->
<div class="overlay hidden" id="overlay">
  <div class="result">
    <div class="emoji" id="rEmoji">🏆</div>
    <h2 id="rTitle">Результат</h2>
    <div class="pts"><span id="rScore">0</span><small> / <span id="rMax">50</span> баллов</small></div>
    <div class="bar"><i id="rBar"></i></div>
    <p id="rAdvice"></p>
    <div class="btn">
      <button class="primary" onclick="restart()">Пройти заново</button>
      <button onclick="toMenu()">К сценариям</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ДАННЫЕ СЦЕНАРИЕВ
   Каждый узел: { client: "реплика клиента", options: [...] }
   Опция: { text, score, feedback, next }
   Финальный узел: { end: true, client: "..." }
   ========================================================= */

const SCENARIOS = {

  family: {
    title: 'Молодая семья',
    subtitle: 'Новостройка 120 м², выбирают систему отопления',
    emoji: '🏠',
    tag: 'Базовый',
    maxScore: 50,
    start: 'start',
    nodes: {
      start: {
        client: 'Здравствуйте! Мы с женой строим дом 120 м², сейчас на этапе разводки коммуникаций. Выбираем отопление. Что можете предложить?',
        options: [
          { text: 'Здравствуйте! Отличный момент, чтобы заложить тёплый пол. Подскажите, какой источник тепла планируете — газ или электричество? И кто будет делать стяжку?',
            score: 10, next: 'n1',
            feedback: 'Вы задали уточняющие вопросы и сразу показали экспертность. Клиент чувствует, что вы разбираетесь в теме, а не продаёте «в лоб».' },
          { text: 'У нас водяной тёплый пол — экономия до 30% и комфорт на всю жизнь. Расскажу подробнее?',
            score: 3, next: 'n1',
            feedback: 'Презентация раньше времени. Вы ещё не выяснили потребности — клиент слушает вполуха, потому что не понимает, про него ли это.' },
          { text: 'Сейчас как раз акция! Скидка 25% при заказе до конца недели, успейте!',
            score: -5, next: 'lost1',
            feedback: 'Давление на старте отталкивает. Клиент ещё не готов покупать, а вы уже толкаете к сделке — включается защита.' }
        ]
      },

      n1: {
        client: 'Газ будет, котёл уже выбрали. Стяжку будем делать сами, но готовы оплатить работу. Тёплый пол рассматриваем, но боимся, что выйдет дорого.',
        options: [
          { text: 'Понимаю опасения. Давайте я посчитаю конкретно по вашей площади — контур, коллектор, монтаж. А вы сравните с радиаторами. Хорошо?',
            score: 10, next: 'n2',
            feedback: 'Отлично! Вы приняли возражение без спора и перевели его в конкретное действие — расчёт. Это снимает тревогу клиента.' },
          { text: 'Не бойтесь, это не так дорого, как кажется.',
            score: 5, next: 'n2',
            feedback: 'Возражение обесценено. Клиент не получил аргумента, он просто услышал «не переживайте». Доверие не выросло.' },
          { text: 'Если денег нет, тогда радиаторы — ваш вариант.',
            score: -3, next: 'lost1',
            feedback: 'Вы сами закрыли сделку. Клиент сказал «боюсь, что дорого», а не «у меня нет денег» — это разные вещи.' }
        ]
      },

      n2: {
        client: 'Хорошо, считайте. Только скажите честно — сколько это займёт по деньгам и по времени?',
        options: [
          { text: 'На 120 м² ориентировочно 180–250 тыс. руб. под ключ, монтаж 5–7 дней. Точную смету пришлю в течение часа — оставьте, пожалуйста, телефон.',
            score: 10, next: 'n3',
            feedback: 'Вы дали вилку цены и срок, не уходя от ответа, и сразу взяли микрокоммитмент — телефон. Идеально.' },
          { text: 'Примерно 200 тысяч и неделя работ.',
            score: 7, next: 'n3',
            feedback: 'Ответ по делу, но без следующего шага. Диалог может закончиться ничем — вы не зафиксировали контакт.' },
          { text: 'Сейчас точно не скажу, нужно приехать и померить.',
            score: 0, next: 'n3',
            feedback: 'Уклонение от ответа. Клиент воспринимает это как «будет дорого, но боятся сказать».' }
        ]
      },

      n3: {
        client: '200 тысяч — это ощутимо. Радиаторы в два раза дешевле выйдут.',
        options: [
          { text: 'Согласен, на старте радиаторы дешевле. Но давайте посмотрим на 10 лет: тёплый пол работает при 35–40 °C, а радиаторы — при 70–80 °C. Расход газа ниже на 20–30%. На 120 м² это экономия примерно 15–25 тыс. руб. за сезон. Плюс комфорт по всей площади, а не точечно.',
            score: 10, next: 'n4',
            feedback: 'Классика: согласие + перевод в долгосрочную выгоду с цифрами. Возражение по цене отработано через TCO.' },
          { text: 'Ну, зато тёплый пол комфортнее.',
            score: 3, next: 'n4',
            feedback: 'Слабый аргумент. «Комфортнее» — это субъективно, а клиент говорит про деньги. Нужны цифры.' },
          { text: 'Радиаторы — прошлый век, все нормальные люди давно ставят тёплый пол.',
            score: -5, next: 'lost1',
            feedback: 'Обесценивание выбора клиента = конфликт. Он защищается и перестаёт слышать вас.' }
        ]
      },

      n4: {
        client: 'Логично. Но у соседа тёплый пол потёк через два года... Гарантию даёте?',
        options: [
          { text: 'Даю 10 лет на трубу и 5 лет на монтаж. Используем PEX-a с антикислородным слоем, делаем опрессовку до заливки стяжки, отдаём акт скрытых работ с фото. У соседа, скорее всего, нарушили шаг или стык — покажу на схеме, как мы это исключаем.',
            score: 10, next: 'n5',
            feedback: 'Тревога снята конкретикой: гарантия, материалы, технология, документы. Плюс вы нейтрально объяснили чужую ошибку.' },
          { text: 'Гарантия есть, всё будет нормально.',
            score: 5, next: 'n5',
            feedback: 'Слишком общо. Клиент боится конкретного риска, а получил общую фразу.' },
          { text: 'Ну, у всех бывает, это редкость.',
            score: 0, next: 'lost1',
            feedback: 'Вы подтвердили риск вместо того, чтобы его снять. Сделка под угрозой.' }
        ]
      },

      n5: {
        client: 'Хорошо, убедили. Что дальше?',
        options: [
          { text: 'Дальше так: сегодня пришлю смету, а завтра встречаемся на объекте — посмотрю планировку и предложу схему укладки. Удобно завтра в 18:00?',
            score: 10, next: 'end_good',
            feedback: 'Сильное закрытие: конкретное действие + альтернативный вопрос по времени. Клиенту легко сказать «да».' },
          { text: 'Оставьте телефон, я перезвоню.',
            score: 6, next: 'end_mid',
            feedback: 'Неплохо, но инициатива у вас слабая. «Перезвоню» — размыто, клиент может остыть.' },
          { text: 'Подумайте, если что — звоните.',
            score: 0, next: 'end_bad',
            feedback: 'Вы отдали инициативу клиенту. В продажах это почти всегда потеря сделки.' }
        ]
      },

      lost1: {
        client: 'Понятно... Спасибо, мы подумаем и вам перезвоним.',
        end: true
      },
      end_good: {
        client: 'Отлично, завтра в 18:00 нас устраивает. Ждём смету!',
        end: true
      },
      end_mid: {
        client: 'Хорошо, записывайте номер. Только не пропадайте, а то знаем мы вас.',
        end: true
      },
      end_bad: {
        client: 'Ага, спасибо. Всего доброго.',
        end: true
      }
    }
  },

  skeptic: {
    title: 'Скептик',
    subtitle: 'Квартира 60 м², боится испортить ремонт и переплатить',
    emoji: '🤨',
    tag: 'Возражения',
    maxScore: 40,
    start: 'start',
    nodes: {
      start: {
        client: 'Алло, я по объявлению. Тёплый пол. Сколько стоит?',
        options: [
          { text: 'Здравствуйте! Цена зависит от площади и типа — водяной или электрический. Подскажите, какая площадь и что уже есть на объекте?',
            score: 10, next: 'n1',
            feedback: 'Правильно: не назвали цену вслепую, а выяснили вводные. Так вы не продешевите и не отпугнёте.' },
          { text: 'От 3000 руб. за м² под ключ.',
            score: 5, next: 'n1',
            feedback: 'Цифра без контекста. Клиент теперь будет торговаться от неё, а вы не знаете его задачу.' },
          { text: 'У нас самые низкие цены в городе!',
            score: -3, next: 'lost2',
            feedback: 'Вы включили ценовую войну. Такой клиент уйдёт к тому, кто скажет «ещё дешевле».' }
        ]
      },

      n1: {
        client: 'Квартира 60 м², хочу в ванную и на кухню. Говорят, электрический — это дорого в эксплуатации.',
        options: [
          { text: 'Верно, электрический дороже в эксплуатации, но для локальных зон — ванная, кухня — это оптимальный вариант. А какое покрытие планируете, плитка?',
            score: 10, next: 'n2',
            feedback: 'Согласие с фактом + сужение задачи до зон. Вы перестали спорить и начали подбирать решение.' },
          { text: 'Да, электрический дорогой, берите водяной.',
            score: 4, next: 'n2',
            feedback: 'Прыжок к решению без анализа. Водяной в квартиру с готовым ремонтом может вообще не подойти.' },
          { text: 'Нет, это миф, всё нормально.',
            score: 0, next: 'n2',
            feedback: 'Спор с клиентом. Даже если он не прав, вы потеряли контакт.' }
        ]
      },

      n2: {
        client: 'Плитка. И я не хочу штробить стены и портить ремонт. Стяжку поднимать тоже нельзя.',
        options: [
          { text: 'Понял. Тогда вам подойдёт тонкий электрический мат 3 мм — укладывается прямо в плиточный клей, без стяжки. Подъём пола около 1 см. Терморегулятор — в подрозетник, без штробления.',
            score: 10, next: 'n3',
            feedback: 'Идеально: вы услышали все три ограничения и закрыли каждое конкретным решением.' },
          { text: 'Есть варианты без стяжки, но они дороже.',
            score: 5, next: 'n3',
            feedback: 'Ответ есть, но вы сразу пугаете ценой, хотя клиент о ней ещё не спросил.' },
          { text: 'Тогда мы, к сожалению, ничем не сможем помочь.',
            score: -2, next: 'lost2',
            feedback: 'Отказ раньше попытки. Почти всегда есть решение — вы его не поискали.' }
        ]
      },

      n3: {
        client: 'Звучит неплохо. И сколько это будет стоить на 8 м²?',
        options: [
          { text: 'Мат, терморегулятор и монтаж — около 45 000 руб. под ключ. Когда удобно, чтобы я приехал на бесплатный замер?',
            score: 10, next: 'end_good',
            feedback: 'Цена + сразу следующий шаг. Клиент получает ответ и лёгкое приглашение к действию.' },
          { text: 'Примерно 45 тысяч.',
            score: 4, next: 'end_mid',
            feedback: 'Ответ дан, но диалог повис. Вы не предложили продолжить.' },
          { text: 'Точно скажу только после замера, примерно 40–50 тысяч.',
            score: 6, next: 'end_mid',
            feedback: 'Честно и с вилкой, но можно было сразу закрыть на замер.' }
        ]
      },

      lost2: {
        client: 'Ясно. Ладно, я тогда ещё поищу варианты. До свидания.',
        end: true
      },
      end_good: {
        client: 'Давайте! Приезжайте в субботу днём — я буду дома.',
        end: true
      },
      end_mid: {
        client: 'Понятно, спасибо. Я подумаю и наберу.',
        end: true
      }
    }
  }
};

/* =========================================================
   ЛОГИКА ТРЕНАЖЁРА
   ========================================================= */

const $ = id => document.getElementById(id);

let state = {};

/* --- Меню --- */
function renderMenu(){
  const menu = $('menu');
  menu.innerHTML = '';
  Object.keys(SCENARIOS).forEach(key => {
    const sc = SCENARIOS[key];
    const card = document.createElement('button');
    card.className = 'card';
    card.innerHTML = `
      <div class="ico">${sc.emoji}</div>
      <h3>${sc.title}</h3>
      <p>${sc.subtitle}</p>
      <span class="tag">${sc.tag}</span>`;
    card.onclick = () => startScenario(key);
    menu.appendChild(card);
  });
}

/* --- Старт сценария --- */
function startScenario(key){
  const sc = SCENARIOS[key];
  state = { key, sc, score: 0 };

  $('menu').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('overlay').classList.add('hidden');
  $('chat').innerHTML = '';
  $('options').innerHTML = '';
  $('score').textContent = '0';

  renderNode(sc.start);
}

/* --- Отрисовка узла --- */
function renderNode(key){
  const node = state.sc.nodes[key];

  if (node.end){
    typing(() => {
      addBubble(node.client, 'client');
      setTimeout(showResult, 900);
    });
    return;
  }

  typing(() => {
    addBubble(node.client, 'client');
    renderOptions(node.options);
  });
}

/* --- Варианты ответа --- */
function renderOptions(options){
  const box = $('options');
  box.innerHTML = '';
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="num">${i + 1}</span><span>${opt.text}</span>`;
    btn.onclick = () => choose(opt);
    box.appendChild(btn);
  });
}

/* --- Выбор ответа --- */
function choose(opt){
  $('options').innerHTML = '';
  addBubble(opt.text, 'me');

  state.score += opt.score;
  $('score').textContent = state.score;
  $('score').style.color = opt.score >= 8 ? '#4dd4ac'
                          : opt.score >= 4 ? '#f4c150' : '#ff5c6c';

  const cls = opt.score >= 8 ? 'good' : opt.score >= 4 ? 'mid' : 'bad';
  const icon = opt.score >= 8 ? '✅' : opt.score >= 4 ? '⚠️' : '❌';
  const sign = opt.score > 0 ? '+' + opt.score : opt.score;

  const fb = document.createElement('div');
  fb.className = 'feedback ' + cls;
  fb.textContent = `${icon} ${opt.feedback}  (${sign})`;
  $('chat').appendChild(fb);
  scroll();

  setTimeout(() => renderNode(opt.next), 950);
}

/* --- Пузырь сообщения --- */
function addBubble(text, who){
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  $('chat').appendChild(div);
  scroll();
}

/* --- Индикатор «печатает» --- */
function typing(cb, delay = 750){
  const t = document.createElement('div');
  t.className = 'bubble client typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  $('chat').appendChild(t);
  scroll();
  setTimeout(() => { t.remove(); cb(); }, delay);
}

function scroll(){
  const c = $('chat');
  c.scrollTop = c.scrollHeight;
}

/* --- Итог --- */
function showResult(){
  const max = state.sc.maxScore;
  const raw = Math.max(0, state.score);
  const pct = Math.min(1, raw / max);

  let emoji, title, advice, color;

  if (pct >= 0.85){
    emoji = '🏆'; title = 'Отличный результат'; color = '#4dd4ac';
    advice = 'Вы ведёте диалог по методике: сначала выявляете потребность, потом предлагаете решение, отрабатываете возражения цифрами и всегда закрываете на следующий шаг. Так работают лучшие продавцы.';
  } else if (pct >= 0.6){
    emoji = '👍'; title = 'Хорошо'; color = '#8fd14f';
    advice = 'База есть, но есть просадки. Чаще всего теряются баллы на преждевременной презентации и слабом закрытии. Добавьте конкретики: цифры, сроки, следующий шаг.';
  } else if (pct >= 0.35){
    emoji = '😐'; title = 'Удовлетворительно'; color = '#f4c150';
    advice = 'Вы больше рассказываете, чем спрашиваете. Перестройте диалог: 70% вопросов — 30% презентации. И не спорьте с возражением, а соглашайтесь и переводите в выгоду.';
  } else {
    emoji = '📉'; title = 'Слабо'; color = '#ff5c6c';
    advice = 'Основные ошибки: давление и скидки в начале, спор с клиентом, отсутствие закрытия. Начните с выяснения потребности и ни разу не обесценивайте выбор клиента.';
  }

  $('rEmoji').textContent = emoji;
  $('rTitle').textContent = title;
  $('rScore').textContent = raw;
  $('rMax').textContent = max;
  $('rAdvice').textContent = advice;

  const bar = $('rBar');
  bar.style.width = '0%';
  bar.style.background = color;
  setTimeout(() => bar.style.width = (pct * 100).toFixed(0) + '%', 60);

  $('overlay').classList.remove('hidden');
}

/* --- Кнопки --- */
function restart(){
  startScenario(state.key);
}
function toMenu(){
  $('overlay').classList.add('hidden');
  $('game').classList.add('hidden');
  $('menu').classList.remove('hidden');
}

/* --- Инициализация --- */
renderMenu();

/* Горячие клавиши 1–3 для выбора ответа */
document.addEventListener('keydown', e => {
  if (['1','2','3','4'].includes(e.key)){
    const btns = document.querySelectorAll('.option');
    const idx = parseInt(e.key) - 1;
    if (btns[idx]) btns[idx].click();
  }
});
</script>
</body>
</html>
